<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Meus Gastos</title>
    <!-- CA-09.3: aplica o tema antes da primeira renderização para não piscar.
         Chave e cores precisam bater com src/lib/theme.ts (teste indexHtmlThemeScript). -->
    <script>
      ;(function () {
        var preference = null
        try {
          preference = localStorage.getItem('theme')
        } catch (error) {}
        var isDark =
          preference === 'dark' ||
          (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', isDark)
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', isDark ? '#0f172a' : '#ffffff')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
